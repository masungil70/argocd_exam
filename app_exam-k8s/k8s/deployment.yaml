apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostname-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      name: my-webserver
      labels:
        app: webserver
    spec:
      containers:
      - name: my-webserver
        image: masungil/echo-hostname:457a5ca0d489404f5884019f4c2244db3bf58613
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
